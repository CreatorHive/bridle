# Packaging: `npm run dist` builds a DMG in dist/. Signing uses the Developer ID in your keychain (or CSC_LINK in CI);
# notarization runs when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set, or locally with a notarytool
# keychain profile: APPLE_KEYCHAIN_PROFILE=bridle npm run dist
appId: com.creatorhive.bridle
productName: Bridle
copyright: Copyright © 2026 Sean Scott
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  category: public.app-category.productivity
  # The Swift helpers (macOS only): on-device search, OCR, transcription, dictation and the notch.
  extraResources:
    - from: native/BridleHelper/.build/release/bridle-helper
      to: bridle-helper
    - from: native/BridleHelper/.build/release/bridle-notch
      to: bridle-notch
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Bridle listens while you dictate a message.
    NSSpeechRecognitionUsageDescription: Bridle turns your speech into text on this Mac.
    LSMinimumSystemVersion: "26.0"
dmg:
  artifactName: Bridle-${version}-${arch}.dmg
# Windows: an x64 installer, unsigned for now (SmartScreen warns until it's signed).
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: Bridle-${version}-setup-${arch}.${ext}
# Linux: an AppImage and a .deb for x64, unsigned. Settings and keys live in ~/.config/Bridle (keys sealed by the
# desktop keyring through safeStorage).
linux:
  icon: resources/icon.png
  category: Office
  synopsis: A personal agent that lives in a folder and writes first.
  maintainer: Sean Scott <sean@sscott.dev>
  syncDesktopName: true # the window's app_id matches bridle.desktop, so the launcher entry and the window are one app
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
appImage:
  artifactName: Bridle-${version}-${arch}.${ext}
deb:
  artifactName: Bridle-${version}-${arch}.${ext}
publish:
  provider: github
  owner: CreatorHive
  repo: bridle
